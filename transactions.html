<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Transacciones — Presupuesto 50/30/20</title>
  <link rel="stylesheet" href="./styles/main.css">
  <link rel="stylesheet" href="./styles/dashboard.css">
  <script type="importmap">
  {
    "imports": {
      "supabase": "https://esm.sh/@supabase/supabase-js@2.45.4",
      "sweetalert2": "https://esm.sh/sweetalert2@11.14.5",
      "jspdf": "https://esm.sh/jspdf@2.5.2"
    }
  }
  </script>
</head>
<body>
  <header class="site-header">
    <div class="bar">
      <a class="brand" href="./dashboard.html" aria-label="Panel principal">💰 Presupuesto 50/30/20</a>
      <nav aria-label="Navegación de la cuenta">
  <a class="btn primary small" href="./dashboard.html" aria-current="page">📋 Panel</a>
  <a class="btn ghost small" href="./transactions.html">📝 Transacciones</a>
  <a class="btn ghost small" href="./analytics.html">📊 Análisis</a>
  <button class="btn icon ghost" id="btn-lock-now" type="button" aria-label="Bloquear pantalla" title="Bloquear pantalla ahora">🔒</button>
  <button class="btn icon ghost" id="btn-security-settings" type="button" aria-label="Ajustes de PIN y Biometría" title="Seguridad y PIN">⚙️</button>
  <button class="btn icon ghost" id="btn-theme-toggle" type="button" aria-label="Cambiar tema" title="Cambiar tema">☀️</button>
  <span class="user-email" id="nav-email" aria-live="polite"></span>
  <button class="btn icon ghost" id="btn-stealth" type="button" aria-pressed="false" aria-label="Activar modo privacidad" title="Modo privacidad">👁️</button>
  <button class="btn small" id="btn-logout" type="button" aria-label="Cerrar sesión">Cerrar sesión</button>
</nav>
    </div>
  </header>

  <main>
    <div class="dash-head">
      <h1>Histórico de Transacciones</h1>
      <div class="actions no-print">
        <button class="btn primary" id="btn-add" type="button">＋ Transacción</button>
        <button class="btn" id="btn-income" type="button">⚙️ Ingreso y divisa</button>
        <button class="btn" id="btn-clone" type="button">🔁 Copiar recurrentes</button>
        <button class="btn" id="btn-categories" type="button">🏷️ Categorías</button>
        <button class="btn" id="btn-csv" type="button">CSV</button>
        <button class="btn" id="btn-pdf" type="button">PDF</button>
      </div>
    </div>

    <section class="card" aria-labelledby="tx-title">
      <div class="toolbar no-print" role="search">
        <label for="f-search">Buscar
          <input id="f-search" type="search" placeholder="Concepto o categoría…" autocomplete="off">
        </label>
        <label for="f-rule">Regla 50/30/20
          <select id="f-rule">
            <option value="todas">Todas</option>
            <option value="necesidades">50% Necesidades</option>
            <option value="deseos">30% Deseos</option>
            <option value="ahorro">20% Ahorro</option>
          </select>
        </label>
        <label for="f-category">Categoría
          <select id="f-category">
            <option value="todas">Todas</option>
          </select>
        </label>
        <label for="f-method">Método de pago
          <select id="f-method">
            <option value="todos">Todos</option>
            <option value="efectivo">Efectivo</option>
            <option value="debito">Débito</option>
            <option value="credito">Crédito</option>
            <option value="transferencia">Transferencia</option>
          </select>
        </label>
        <label for="f-period">Período
          <select id="f-period">
            <option value="todos">Todas las fechas</option>
            <option value="mes_actual">Mes actual</option>
            <option value="mes_anterior">Mes anterior</option>
            <option value="anio">Año completo</option>
          </select>
        </label>
      </div>

      <div class="table-wrap">
        <table class="tx-table" id="tx-table">
          <thead>
            <tr>
              <th scope="col" data-sort="fecha" tabindex="0" aria-sort="descending">Fecha</th>
              <th scope="col">Concepto</th>
              <th scope="col">Regla</th>
              <th scope="col">Detalle</th>
              <th scope="col">Pago</th>
              <th scope="col" class="num" data-sort="monto" tabindex="0">Monto</th>
              <th scope="col" class="no-print">Acciones</th>
            </tr>
          </thead>
          <tbody id="tx-body">
            <tr><td colspan="7" class="empty-state">Cargando transacciones…</td></tr>
          </tbody>
        </table>
      </div>

      <div class="pagination no-print">
        <label for="page-size" style="display:inline-flex;align-items:center;gap:.5rem">Por página
          <select id="page-size">
            <option value="10">10</option>
            <option value="25">25</option>
            <option value="50">50</option>
          </select>
        </label>
        <span id="page-info" aria-live="polite"></span>
        <span class="pager">
          <button class="btn small" id="page-prev" type="button">‹ Anterior</button>
          <button class="btn small" id="page-next" type="button">Siguiente ›</button>
        </span>
      </div>
    </section>
  </main>

  <script type="module" src="./js/controllers/transactionsController.js"></script>
</body>
</html>
